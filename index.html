<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>○○チャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f7f7;
      color: #333;
    }

    header {
      padding: 25px 15px 10px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
    }

    .admin-info {
      font-size: 12px;
      color: #777;
    }

    .rules,
    .popular,
    .form,
    .chat {
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
    }

    .rules {
      background: white;
      padding: 18px;
      border-radius: 15px;
    }

    .rules h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .rules p {
      font-size: 14px;
      margin: 8px 0;
    }

    .room {
      background: white;
      margin: 8px 0;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .chat {
      display: none;
    }

    .chat-header {
      background: white;
      padding: 15px;
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #messages {
      height: 400px;
      overflow-y: auto;
      background: white;
      padding: 15px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .message {
      margin: 8px 0;
      padding: 10px;
      background: #f1f1f1;
      border-radius: 10px;
      text-align: left;
    }

    .system-message {
      margin: 8px 0;
      color: #777;
      font-size: 13px;
      text-align: center;
    }

    .send-area {
      display: flex;
      gap: 8px;
      background: white;
      padding: 10px;
      border-radius: 0 0 12px 12px;
    }

    .send-area input {
      margin: 0;
    }

    .send-area button {
      width: 90px;
    }

    footer {
      text-align: center;
      margin: 35px 0;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

<header>
  <h1>○○チャット</h1>
  <div class="admin-info">
    👑 管理者には👑マークが付きます！
  </div>
</header>

<section class="rules">
  <h2>📜 ルール</h2>
  <p>・人が嫌がることをしない</p>
  <p>・荒らしや迷惑行為は禁止です</p>
  <p>・個人情報を書き込まないでください</p>
  <p>🔗 外部リンク</p>
</section>

<section class="popular" id="roomList">
  <h2>🔥 人気の部屋</h2>

  <div class="room" onclick="selectRoom('暇部屋')">
    <span>暇部屋</span>
    <span>👥 <span id="count-himabeya">0</span>人</span>
  </div>

  <div class="room" onclick="selectRoom('雑談部屋')">
    <span>雑談部屋</span>
    <span>👥 0人</span>
  </div>

  <div class="room" onclick="selectRoom('ゲーム')">
    <span>ゲーム</span>
    <span>👥 0人</span>
  </div>

  <div class="room" onclick="selectRoom('ひまー')">
    <span>ひまー</span>
    <span>👥 0人</span>
  </div>

  <div class="room" onclick="selectRoom('なんでも')">
    <span>なんでも</span>
    <span>👥 0人</span>
  </div>
</section>

<section class="form" id="loginForm">

  <label>部屋名を入力</label>
  <input id="roomInput" type="text" placeholder="部屋名">

  <label>名前を入力</label>
  <input id="nameInput" type="text" placeholder="名前">

  <label>ID入力</label>
  <input id="idInput" type="text" placeholder="ID">

  <button onclick="enterRoom()">入室</button>

</section>

<section class="chat" id="chat">

  <div class="chat-header">
    <strong id="roomTitle">チャット</strong>
    <button onclick="leaveRoom()" style="width:80px;">退出</button>
  </div>

  <div id="messages"></div>

  <div class="send-area">
    <input id="messageInput" type="text" placeholder="メッセージ">
    <button onclick="sendMessage()">送信</button>
  </div>

</section>

<footer>
  ○○チャット
</footer>


<!-- Firebase -->
<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // ↓↓↓ Firebaseの設定をここに入れる ↓↓↓

  const firebaseConfig = {
  apiKey: "AIzaSyBt6qwbPyalAJ5L0NF18ZteTB3WWBxZc3M",
  authDomain: "chat-site-6e8d1.firebaseapp.com",
  projectId: "chat-site-6e8d1",
  storageBucket: "chat-site-6e8d1.firebasestorage.app",
  messagingSenderId: "7326079507",
  appId: "1:7326079507:web:7df8704aa219a78a057de6"
};
  


  // Firebaseを開始
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  let currentRoom = "";
  let currentName = "";
  let currentId = "";


  window.selectRoom = function(room) {
    document.getElementById("roomInput").value = room;
    document.getElementById("nameInput").focus();
  };


  window.enterRoom = async function() {

    const room = document.getElementById("roomInput").value.trim();
    const name = document.getElementById("nameInput").value.trim();
    const id = document.getElementById("idInput").value.trim();

    if (!room || !name || !id) {
      alert("部屋名・名前・IDを全部入力してね！");
      return;
    }

    currentRoom = room;
    currentName = name;
    currentId = id;

    document.getElementById("loginForm").style.display = "none";
    document.getElementById("roomList").style.display = "none";
    document.getElementById("chat").style.display = "block";

    document.getElementById("roomTitle").textContent =
      "💬 " + room;


    // 入室メッセージ
    await addDoc(collection(db, "messages"), {
      room: currentRoom,
      type: "join",
      name: currentName,
      id: currentId,
      text: currentName + "さんが入室しました",
      createdAt: serverTimestamp()
    });


    listenMessages();
  };


  function listenMessages() {

    const q = query(
      collection(db, "messages"),
      orderBy("createdAt")
    );

    onSnapshot(q, (snapshot) => {

      const messages =
        document.getElementById("messages");

      messages.innerHTML = "";

      snapshot.forEach((doc) => {

        const data = doc.data();

        // 今いる部屋だけ表示
        if (data.room !== currentRoom) return;


        if (data.type === "join" ||
            data.type === "leave") {

          const div =
            document.createElement("div");

          div.className = "system-message";
          div.textContent = data.text;

          messages.appendChild(div);

        } else {

          const div =
            document.createElement("div");

          div.className = "message";

          div.innerHTML =
            "<strong>" +
            escapeHtml(data.name) +
            "</strong><br>" +
            escapeHtml(data.text);

          messages.appendChild(div);
        }

      });

      messages.scrollTop = messages.scrollHeight;
    });
  }


  window.sendMessage = async function() {

    const input =
      document.getElementById("messageInput");

    const text = input.value.trim();

    if (!text) return;


    await addDoc(collection(db, "messages"), {

      room: currentRoom,
      type: "message",
      name: currentName,
      id: currentId,
      text: text,
      createdAt: serverTimestamp()

    });

    input.value = "";
    input.focus();
  };


  window.leaveRoom = async function() {

    await addDoc(collection(db, "messages"), {

      room: currentRoom,
      type: "leave",
      name: currentName,
      id: currentId,
      text: currentName + "さんが退出しました",
      createdAt: serverTimestamp()

    });

    document.getElementById("chat").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("roomList").style.display = "block";

  };


  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }

</script>

</body>
</html>
